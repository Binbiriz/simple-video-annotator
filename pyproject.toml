[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vidnote"
version = "0.1.0"
description = "Click on a video to place text and blur annotations, then render them with ffmpeg."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
vidnote = "vidnote.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
