name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, vMAJOR.MINOR.PATCH (must match the version in pyproject.toml)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      REF: ${{ github.ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate input
        shell: bash
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be made from main (this run is on '$REF')."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$TAG'. Expected vMAJOR.MINOR.PATCH, for example v0.2.0. Suffixes such as -rc1 are not accepted."
            exit 1
          fi

          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml."
            exit 1
          fi

          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            echo "::error::A release for $TAG already exists."
            exit 1
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core libxcb-cursor0 \
            libegl1 libgl1 libxkbcommon0

      - name: Lint and test
        run: |
          pip install -e ".[dev]"
          ruff check src tests
          pytest

      - name: Build the AppImage
        run: bash packaging/appimage/build.sh

      - name: Smoke test the AppImage
        shell: bash
        run: |
          shopt -s nullglob
          images=(dist/vidnote-*-x86_64.AppImage)
          if [ "${#images[@]}" -ne 1 ] || [ ! -x "${images[0]}" ]; then
            echo "::error::Expected exactly one executable AppImage in dist/."
            exit 1
          fi
          image="$PWD/${images[0]}"

          # 124 means the app was still running when the timeout hit, so the window opened.
          code=0
          QT_QPA_PLATFORM=offscreen timeout 10 "$image" --appimage-extract-and-run || code=$?
          if [ "$code" -ne 124 ]; then
            echo "::error::The AppImage exited with code $code instead of staying open."
            exit 1
          fi

          mkdir "$RUNNER_TEMP/extract"
          (cd "$RUNNER_TEMP/extract" && "$image" --appimage-extract > /dev/null)
          root="$RUNNER_TEMP/extract/squashfs-root"
          test -f "$root/annotate.sh"
          test -f "$root/vidnote/__main__.py"
          if [ -n "$(find "$root" \( -name '*.mp4' -o -name '*.mkv' \) -print -quit)" ]; then
            echo "::error::The AppImage contains video files."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/vidnote-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: Re-check the tag and release
        shell: bash
        run: |
          if gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq '.[].ref' | grep -Fxq "refs/tags/$TAG"; then
            echo "::error::Tag $TAG now exists."
            exit 1
          fi
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            echo "::error::A release for $TAG now exists."
            exit 1
          fi

      - name: Create draft release
        id: draft
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/vidnote-*-x86_64.AppImage)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one AppImage artifact."
            exit 1
          fi

          echo "started=true" >> "$GITHUB_OUTPUT"
          # A draft does not create the tag; the tag is created when it is published.
          gh release create "$TAG" "${files[0]}" --draft --target "$SHA" --generate-notes --title "$TAG"
          id="$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .id')"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Check the draft assets
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          names="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name')"
          echo "$names"
          if [ "$(echo "$names" | wc -l)" -ne 1 ] || [[ "$names" != *-x86_64.AppImage ]]; then
            echo "::error::The release must have exactly one asset, the x86_64 AppImage."
            exit 1
          fi

      - name: Publish release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false

      - name: Clean up after a failure
        if: failure() && steps.draft.outputs.started == 'true'
        shell: bash
        run: |
          # The re-check step proved that neither a tag nor a release existed for $TAG when this
          # run started, so whatever exists for it now was created by this run.
          for id in $(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .id'); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id" || true
          done
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" || true
